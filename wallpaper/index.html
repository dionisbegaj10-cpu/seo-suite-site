<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>SSUITE — Live Wallpaper</title>
<meta content="The seosuite.studio hero orb as a full-screen, interactive live wallpaper. Add it to your Home Screen." name="description"/>
<meta content="noindex, follow" name="robots"/>

<!-- Home Screen web app: launches full screen, no browser chrome. -->
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="yes" name="mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="SSUITE" name="apple-mobile-web-app-title"/>
<meta content="#0e0e0e" name="theme-color"/>
<link href="/img/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/>
<link href="/img/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png"/>

<style>
    :root {
        --bg: #0e0e0e;
        --ink: #ffffff;
        --dot: 255,255,255;
    }
    html.theme-light {
        --bg: #ffffff;
        --ink: #1c1c1c;
        --dot: 208,208,208;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        /* The orb is the whole interface — nothing here should scroll,
           bounce, select or zoom the way a normal page does. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        transition: background-color .6s ease, color .6s ease;
    }

    #blob_container {
        position: fixed;
        inset: 0;
        /* Lifted off centre so the headline below it keeps clear space. */
        transform: translateY(-7%);
        width: 100vw;
        height: 100vh;
        height: 100dvh;
    }

    /* Clock + date, sized like a lock screen. */
    #clock {
        position: fixed;
        top: max(6vh, env(safe-area-inset-top));
        left: 0;
        right: 0;
        text-align: center;
        pointer-events: none;
        opacity: .92;
        transition: opacity .5s ease;
    }
    html.no-clock #clock { opacity: 0; }
    #time {
        font-size: clamp(56px, 11vw, 128px);
        font-weight: 200;
        letter-spacing: -.02em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }
    #date {
        margin-top: .5em;
        font-size: clamp(13px, 2vw, 18px);
        font-weight: 400;
        letter-spacing: .18em;
        text-transform: uppercase;
        opacity: .55;
    }

    /* The homepage headline, in the site's own display face. */
    @font-face {
        font-family: 'Grumpy 24';
        src: url('/css/fonts/Grumpy-Black24.woff2') format('woff2'),
             url('/css/fonts/Grumpy-Black24.woff') format('woff');
        font-weight: 900;
        font-style: normal;
        font-display: swap;
    }

    #mark {
        position: fixed;
        bottom: max(5vh, env(safe-area-inset-bottom));
        left: 0;
        right: 0;
        text-align: center;
        pointer-events: none;
    }
    #intro {
        font-family: 'Grumpy 24', Georgia, serif;
        font-weight: 900;
        font-size: clamp(38px, 8.5vw, 104px);
        line-height: .96;
        opacity: .92;
    }
    /* One word per line, as the homepage sets it. */
    #intro .no-wrap { display: block; }
    /* Letters rise into place on load, 15ms apart — the homepage's reveal. */
    #intro span {
        display: inline-block;
        opacity: 0;
        transform: translateY(15px);
        transition-property: transform, opacity;
        transition-duration: .45s, .45s;
        transition-timing-function: cubic-bezier(.25, .46, .45, .94);
    }
    #intro.animated span {
        opacity: 1;
        transform: translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
        #intro span { opacity: 1; transform: none; transition: none; }
    }

    /* Controls: out of the way until tapped. */
    #controls {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        display: flex;
        gap: 8px;
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity .35s ease, transform .35s ease;
        pointer-events: none;
    }
    html.show-controls #controls {
        opacity: 1;
        transform: none;
        pointer-events: auto;
    }
    #controls button {
        appearance: none;
        border: 1px solid currentColor;
        background: transparent;
        color: var(--ink);
        opacity: .5;
        border-radius: 999px;
        padding: 9px 16px;
        font: inherit;
        font-size: 12px;
        letter-spacing: .12em;
        text-transform: uppercase;
        cursor: pointer;
    }
    #controls button:active { opacity: 1; }

    /* One-time hint, fades itself out. */
    #hint {
        font-size: 12px;
        letter-spacing: .1em;
        opacity: .35;
        margin-bottom: 1.6em;
        transition: opacity 1s ease;
    }
    #hint.gone { opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
        html, body, #clock, #hint { transition: none; }
    }
</style>
</head>
<body>

<div id="blob_container"></div>

<div id="clock">
<div id="time">--:--</div>
<div id="date"></div>
</div>

<div id="mark">
<div id="hint">Drag to spin · tap to show controls</div>
<h1 id="intro">
<i class="no-wrap">digital</i>
<i class="no-wrap">creative</i>
<i class="no-wrap">studio</i>
</h1>
</div>

<div id="controls">
<button id="toggle-theme" type="button">Theme</button>
<button id="toggle-clock" type="button">Clock</button>
</div>


<script src="/js/libs/jsband-min.js"></script>
<script src="/js/blob-min.js"></script>
<script>
(function () {
    var root = document.documentElement;

    // --- Preferences ------------------------------------------------------
    // Kept per-device so the wallpaper opens the way it was left.
    function pref(key, fallback) {
        try {
            var v = localStorage.getItem(key);
            return v === null ? fallback : v;
        } catch (e) { return fallback; }
    }
    function setPref(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
    }

    var theme = pref('ssuite-wp-theme', 'dark');
    var clockOn = pref('ssuite-wp-clock', '1') === '1';
    root.classList.toggle('theme-light', theme === 'light');
    root.classList.toggle('no-clock', !clockOn);

    function dotColor() {
        return theme === 'light' ? '#d0d0d0' : '#ffffff';
    }

    // --- The orb ----------------------------------------------------------
    // Same shapes and settings as the homepage hero (js/main.js), so this is
    // the site's own sphere rather than a lookalike.
    var shapes = [
        {
            wave1: {amplitude: 76.923, frequency: 0.879, phase: 0},
            wave2: {amplitude: 60, frequency: 0.165, phase: 0},
            wave3: {amplitude: 50, frequency: 0, phase: 0}
        },
        {
            wave1: {amplitude: 200, frequency: 7.692, phase: 6.283},
            wave2: {amplitude: 200, frequency: 7.912, phase: 6.283},
            wave3: {amplitude: 200, frequency: 10, phase: 6.283}
        }
    ];

    var narrow = Math.min(window.innerWidth, window.innerHeight) < 700;
    var blob = new BlobAnimation('blob_container', {
        BLOB_SIZE: 250,
        // Closer than the hero's 1000 so the orb fills a tablet screen.
        BLOB_DISTANCE: narrow ? 900 : 820,
        DETALISATION: 60,
        PERSPECTIVE_DISTORTION: 1,
        ROTATION_SPEED: 5,
        DOT_SIZE: narrow ? 1.2 : 1.6,
        DOT_COLOR: dotColor(),
        MOUSE_DISTANCE_MIN: 20,
        MOUSE_DISTANCE_MAX: 400,
        MOUSE_SENSITIVITY: 1,
        INERTIAL_TIME: 4,
        INITIAL_SHAPE: shapes[1],
        USE_WAVE_MOTION: true,
        USE_WAVE_SWING: true,
        USE_MORPHING: true,
        MORPHING_AUTOPLAY: true,
        MORPHING_DURATION: 1,
        MORPHING_DELAY: 0,
        MORPHING_TRANSITION_TYPE: 'cubic',
        MORPHING_SHAPES: [shapes[0]],
        WAVE_1_MOTION_SPEED: 1.3,
        WAVE_2_MOTION_SPEED: 0.8
    });

    // --- Touch ------------------------------------------------------------
    // blob-min.js only listens for mousemove, which a touchscreen never
    // fires. Replay finger movement as synthetic mouse moves so dragging
    // spins the orb exactly as it does under a cursor on the desktop site.
    function relay(x, y) {
        document.dispatchEvent(new MouseEvent('mousemove', {
            clientX: x, clientY: y, bubbles: true
        }));
    }
    var moved = false;
    document.addEventListener('touchstart', function (e) {
        moved = false;
        var t = e.touches[0];
        if (t) relay(t.clientX, t.clientY);
    }, {passive: true});
    document.addEventListener('touchmove', function (e) {
        var t = e.touches[0];
        if (!t) return;
        moved = true;
        relay(t.clientX, t.clientY);
    }, {passive: true});
    // Stop the page itself from panning or rubber-banding under the drag.
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

    // --- Controls ---------------------------------------------------------
    var controlsTimer;
    function showControls() {
        root.classList.add('show-controls');
        clearTimeout(controlsTimer);
        controlsTimer = setTimeout(function () {
            root.classList.remove('show-controls');
        }, 4000);
    }
    document.addEventListener('touchend', function () {
        if (!moved) showControls();
    });
    document.addEventListener('click', function (e) {
        if (!e.target.closest('#controls')) showControls();
    });

    document.getElementById('toggle-theme').addEventListener('click', function () {
        theme = theme === 'dark' ? 'light' : 'dark';
        setPref('ssuite-wp-theme', theme);
        root.classList.toggle('theme-light', theme === 'light');
        blob.dotColor = dotColor();
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#ffffff' : '#0e0e0e');
        showControls();
    });

    document.getElementById('toggle-clock').addEventListener('click', function () {
        clockOn = !clockOn;
        setPref('ssuite-wp-clock', clockOn ? '1' : '0');
        root.classList.toggle('no-clock', !clockOn);
        showControls();
    });

    // --- Clock ------------------------------------------------------------
    var timeEl = document.getElementById('time');
    var dateEl = document.getElementById('date');
    function tick() {
        var now = new Date();
        timeEl.textContent = now.toLocaleTimeString([], {
            hour: '2-digit', minute: '2-digit'
        });
        dateEl.textContent = now.toLocaleDateString([], {
            weekday: 'long', day: 'numeric', month: 'long'
        });
    }
    tick();
    setInterval(tick, 1000);

    // --- Headline ---------------------------------------------------------
    // Split each word into letters and stagger them 15ms apart, the same
    // reveal setAnimationDelay() drives on the homepage.
    var intro = document.getElementById('intro');
    var letter = 0;
    Array.prototype.forEach.call(intro.querySelectorAll('.no-wrap'), function (word) {
        var text = word.textContent;
        word.textContent = '';
        text.split('').forEach(function (ch) {
            var span = document.createElement('span');
            span.textContent = ch;
            span.style.transitionDelay = (letter++ * 15) + 'ms';
            word.appendChild(span);
        });
    });
    requestAnimationFrame(function () {
        requestAnimationFrame(function () { intro.classList.add('animated'); });
    });

    // --- Hint -------------------------------------------------------------
    var hint = document.getElementById('hint');
    setTimeout(function () { hint.classList.add('gone'); }, 5000);
})();
</script>
</body>
</html>
